<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Waymode — real app, real source, real calls</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e9edf4;
        color: #18232f;
        font-family: Arial, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .caption {
        position: absolute;
        left: 24px;
        top: 25px;
        margin: 0;
        font-size: 36px;
        letter-spacing: -1.1px;
        width: 1100px;
        height: 46px;
      }
      .label {
        position: absolute;
        right: 40px;
        top: 39px;
        margin: 0;
        font: 16px monospace;
        color: #33425b;
      }
      video {
        position: absolute;
        top: 88px;
        border: 1px solid #b8c1cf;
        border-radius: 12px;
        object-fit: contain;
      }
      #app {
        left: 24px;
        width: 840px;
        height: 940px;
      }
      #inspector {
        left: 884px;
        width: 1000px;
        height: 940px;
      }
      #footer {
        position: absolute;
        left: 24px;
        top: 1041px;
        font: 16px monospace;
      }
      #scope {
        position: absolute;
        right: 36px;
        top: 1041px;
        font: 16px monospace;
      }
      #progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 4px;
        background: #2759e9;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="1920"
      data-height="1080"
    >
      __CAPTIONS__
      <p id="capture-label" class="label">
        2 real windows · continuous · 1× speed
      </p>
      <video
        id="app"
        src="assets/app.mp4"
        data-start="0"
        data-duration="__DURATION__"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <video
        id="inspector"
        src="assets/inspector.mp4"
        data-start="0"
        data-duration="__DURATION__"
        data-track-index="1"
        muted
        playsinline
      ></video>
      <span id="footer">github.com/mossburgh/waymode</span>
      <span id="scope">New API field + UI. Same SDK. Live Jev.</span>
      <div id="progress" aria-hidden="true"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#progress",
        { width: 0 },
        { width: 1920, duration: __DURATION__, ease: "none" },
        0,
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
